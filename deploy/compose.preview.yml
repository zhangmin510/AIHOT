# Complete SSR preview. Use a dedicated project and persistent volumes; no worker.
name: evalfrontier-preview

x-app: &app
  build:
    context: ..
  image: evalfrontier-preview-app
  env_file: ${AIHOT_PREVIEW_ENV_FILE:-../.env.preview}
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    AIHOT_ENVIRONMENT: preview
    AIHOT_PREVIEW: "true"
    DATABASE_URL: postgres://evalfrontier:${POSTGRES_PASSWORD:?Dedicated database password required}@db:5432/evalfrontier
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    LOCAL_ROUTER_URL: http://web:3000
    TRUST_PROXY: "true"
    COLLECT_ENABLED: "false"
    MODEL_CALLS_ENABLED: "false"
    FEISHU_CONTENT_PUSH_ENABLED: "false"
    FEISHU_INTERNAL_ENABLED: "false"
    INDEXNOW_SUBMIT_ENABLED: "false"
  volumes:
    - data:/data

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evalfrontier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Dedicated database password required}
      POSTGRES_DB: evalfrontier
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U evalfrontier -d evalfrontier]
      interval: 5s
      timeout: 5s
      retries: 30
  setup:
    <<: *app
    restart: "no"
    command: [sh, -c, node scripts/migrate.ts && node scripts/seed.ts]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    command: [node, apps/api/src/main.ts]
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully
  web:
    <<: *app
    command: [node, apps/web/server.ts]
    environment:
      <<: *app-env
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_started
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "${PREVIEW_HTTP_PORT:-80}:80"
      - "${PREVIEW_HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Public domain required}
    volumes:
      - ./Caddyfile.preview:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

volumes:
  db: {}
  data: {}
  caddy: {}
